name: Python tests

on:
  push:
    branches: ["main", "feature/approved-system-tools"]
  pull_request:
    branches: ["main"]

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s local_chat -p "test_*.py" -v

      - name: Validate chat JavaScript syntax
        run: node --check local_chat/static/app.js

      - name: Verify no nested ZIP archives are tracked
        if: success()
        shell: pwsh
        run: |
          $nested = git ls-files | Where-Object { $_ -like '*.zip' }
          if ($nested) {
            Write-Error ("Nested ZIP files must not be included in the source artifact: " + ($nested -join ", "))
            exit 1
          }
      - name: Upload clean source artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIResearch-final
          path: |
            .
            !.git/**
            !**/.venv/**
            !**/__pycache__/**
            !**/*.pyc
            !**/*.zip
          exclude-hidden-files: true
          if-no-files-found: error
          retention-days: 14
