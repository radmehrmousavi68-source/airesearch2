name: Python tests

on:
  push:
    branches: ["main", "feature/approved-system-tools"]
  pull_request:
    branches: ["main"]

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s local_chat -p "test_*.py" -v

      - name: Validate chat JavaScript syntax
        run: node --check local_chat/static/app.js

      - name: Package tested source
        if: success()
        shell: pwsh
        run: git archive --format=zip --output=AIResearch-final.zip HEAD
      - name: Upload final source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIResearch-final
          path: AIResearch-final.zip
          if-no-files-found: error
          retention-days: 14
